[package]
name = "ignis"
version = "0.1.0"
authors = ["thane98"]
edition = "2018"

[lib]
name = "ignis"
crate-type = ["cdylib"]

[dependencies.pyo3]
version = "0.22.0"
features = ["extension-module", "gil-refs"]

[dependencies]
paragon = { git = "https://github.com/thane98/paragon", rev = "d11d601" }
exalt = { git = "https://github.com/thane98/exalt-rs", rev = "55bab5f" }
asset-pack-rs = { git = "https://github.com/thane98/asset-pack-rs", rev = "d41a607" }
mila = { git = "https://github.com/thane98/mila", rev = "b95ead6" }
rand = "0.8.4"
rand_pcg = "0.3.1"
handlebars = "4.1.0"
serde_json = "1.0.27"
